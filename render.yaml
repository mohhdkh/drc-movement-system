services:
  - type: web
    name: drc-movement-system
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:review
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: PGPOOL_MAX
        value: "5"
      - key: CLIENT_ORIGIN
        sync: false
      - key: MOVEMENT_TIMEZONE
        value: Asia/Gaza
      - key: MOVEMENT_CUTOFF_HOUR
        value: "12"
      - key: MOVEMENT_PLAN_TEMPLATE_PATH
        value: /app/doc/Movement_Tracker_LIVE (1).xlsm
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LOG_REQUESTS
        value: "true"
      - key: SERVE_CLIENT
        value: "true"
      - key: CLIENT_DIST_PATH
        value: /app/client/dist
      - key: AUTH_PROVIDER
        value: review
      - key: REVIEW_MODE
        value: "true"
      - key: REVIEW_ACCESS_USERNAME
        sync: false
      - key: REVIEW_ACCESS_PASSWORD
        sync: false
      - key: VITE_AUTH_PROVIDER
        value: development
      - key: MS_SHAREPOINT_ENV_ENABLED
        value: "false"
